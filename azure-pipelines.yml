trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  terraformVersion: '1.6.6'

stages:
  - stage: Terraform
    jobs:
      - job: TerraformDeployment
        steps:
          - checkout: self

          - task: UsePythonVersion@0
            inputs:
              versionSpec: '3.x'

          - task: TerraformInstaller@1
            inputs:
              terraformVersion: '$(terraformVersion)'

          - task: AzureCLI@2
            inputs:
              azureSubscription: 'sp-proj-cs'  # replace with your actual service connection name
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Logging into Azure via Azure CLI"
                az account show

          - script: |
              terraform init \
                -backend-config="resource_group_name=tfstate" \
                -backend-config="storage_account_name=chaosstatestorage" \
                -backend-config="container_name=tfstate" \
                -backend-config="key=chaosstudio.tfstate"
            displayName: 'Terraform Init with Backend'

          - script: |
              terraform validate
            displayName: 'Terraform Validate'

          - script: |
              terraform plan -out=tfplan
            displayName: 'Terraform Plan'

          # Uncomment to enable automatic apply
          # - script: |
          #     terraform apply -auto-approve tfplan
          #   displayName: 'Terraform Apply'