pool:
  vmImage: 'ubuntu-latest'

variables:
  terraformVersion: '1.6.6'
  azureSubscription: 'sp-proj-cs'
  tfStateRG: 'tfstate'
  tfStateStorage: 'chaosstatestorage'
  tfStateContainer: 'tfstate'
  tfStateKey: 'chaosstudio.tfstate'

stages:
- stage: Init
  displayName: 'Terraform Init'
  jobs:
    - job: InitJob
      displayName: 'Init Job'
      steps:
        - checkout: self
          persistCredentials: true

        - script: |
            echo "Installing Terraform $(terraformVersion)..."
            wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
            unzip terraform_$(terraformVersion)_linux_amd64.zip
            sudo mv terraform /usr/local/bin/
            terraform --version
          displayName: 'Install Terraform'

        - script: |
            echo "Removing old Azure CLI..."
            sudo apt-get remove -y azure-cli

            echo "Installing dependencies..."
            sudo apt-get update
            sudo apt-get install -y ca-certificates curl apt-transport-https lsb-release gnupg

            echo "Adding Microsoft package signing key to keyring..."
            sudo mkdir -p /etc/apt/keyrings
            curl -sL https://packages.microsoft.com/keys/microsoft.asc | gpg --dearmor | sudo tee /etc/apt/keyrings/microsoft.gpg > /dev/null

            echo "Adding Azure CLI repository with correct signed-by..."
            AZ_REPO=$(lsb_release -cs)
            echo "deb [arch=amd64 signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/azure-cli/ $AZ_REPO main" | sudo tee /etc/apt/sources.list.d/azure-cli.list

            echo "Installing latest Azure CLI..."
            sudo apt-get update
            sudo apt-get install -y azure-cli

            echo "Azure CLI version after upgrade:"
            az --version
          displayName: 'Install Latest Azure CLI'

        - task: AzureCLI@2
          displayName: 'Temporarily Open Storage Account for Init'
          inputs:
            azureSubscription: $(azureSubscription)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              echo "Getting agent's public IP..."
              AGENT_IP=$(curl -s https://api.ipify.org)
              echo "##vso[task.setvariable variable=agent_ip]$AGENT_IP"

              echo "Adding agent IP to Storage Account firewall..."
              az storage account network-rule add \
                --resource-group ${{ variables.tfStateRG }} \
                --account-name ${{ variables.tfStateStorage }} \
                --ip-address $AGENT_IP

        - script: |
            echo "Terraform Init using Service Principal"
            export ARM_CLIENT_ID=$(servicePrincipalId)
            export ARM_CLIENT_SECRET=$(servicePrincipalKey)
            export ARM_TENANT_ID=$(tenantId)
            export ARM_SUBSCRIPTION_ID=$(subscriptionId)

            echo "Sleeping 10 seconds to allow firewall rules to propagate..."
            sleep 10

            terraform init \
              -backend-config="resource_group_name=$(tfStateRG)" \
              -backend-config="storage_account_name=$(tfStateStorage)" \
              -backend-config="container_name=$(tfStateContainer)" \
              -backend-config="key=$(tfStateKey)"
          displayName: 'Terraform Init with SP Auth'

        - publish: $(System.DefaultWorkingDirectory)
          artifact: terraformWorkspace
          displayName: 'Publish Terraform Init Artifacts'

        - task: AzureCLI@2
          displayName: 'Remove Agent IP from Firewalls'
          condition: always()
          inputs:
            azureSubscription: $(azureSubscription)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              echo "Removing agent IP from Storage Account..."
              az storage account network-rule remove \
                --resource-group ${{ variables.tfStateRG }} \
                --account-name ${{ variables.tfStateStorage }} \
                --ip-address $(agent_ip)

- stage: Plan
  displayName: 'Terraform Plan'
  dependsOn: Init
  jobs:
    - job: PlanJob
      displayName: 'Plan Job'
      steps:
        - checkout: self
          persistCredentials: true

        - task: DownloadPipelineArtifact@2
          displayName: 'Download Terraform Init State'
          inputs:
            artifact: terraformWorkspace
            path: $(Pipeline.Workspace)/terraformWorkspace

        - script: |
            echo "Installing Terraform $(terraformVersion)..."
            wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
            unzip terraform_$(terraformVersion)_linux_amd64.zip
            sudo mv terraform /usr/local/bin/
            terraform --version
          displayName: 'Install Terraform'

        - script: |
            echo "Terraform Plan using Service Principal"
            
            export ARM_CLIENT_ID=$(servicePrincipalId)
            export ARM_CLIENT_SECRET=$(servicePrincipalKey)
            export ARM_SUBSCRIPTION_ID=$(subscriptionId)
            export ARM_TENANT_ID=$(tenantId)

            echo "Switching to downloaded Terraform workspace directory"
            cd $(Pipeline.Workspace)/terraformWorkspace

            echo "Re-initializing Terraform without backend..."
            terraform init -backend=false

            echo "Running terraform plan..."
            terraform plan \
              -var="subscription_id=$(subscriptionId)" \
              -var-file="env.tfvars" \
              -out=tfplan
          displayName: 'Terraform Plan with SP Auth (No backend init)'

        - publish: $(Pipeline.Workspace)/terraformWorkspace/tfplan
          artifact: terraformPlan

- stage: Apply
  displayName: 'Terraform Apply'
  dependsOn: Plan
  jobs:
    - deployment: ApplyJob
      displayName: 'Terraform Apply with Approval'
      environment: ChaosStudioEnv
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self
                persistCredentials: true

              - script: |
                  echo "Installing Terraform $(terraformVersion)..."
                  wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
                  unzip terraform_$(terraformVersion)_linux_amd64.zip
                  sudo mv terraform /usr/local/bin/
                  terraform --version
                displayName: 'Install Terraform'

              - task: AzureCLI@2
                displayName: 'Add DevOps Agent IP to Storage Account (temporarily)'
                inputs:
                  azureSubscription: $(azureSubscription)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    agentIP=$(curl -s https://checkip.amazonaws.com)
                    echo "Temporarily allowing IP: $agentIP on storage account"
                    az storage account network-rule add \
                      --resource-group $(tfStateRG) \
                      --account-name $(tfStateStorage) \
                      --ip-address $agentIP

              - task: DownloadPipelineArtifact@2
                displayName: 'Download tfplan artifact'
                inputs:
                  artifact: terraformPlan
                  path: terraformPlan

              - script: |
                  echo "Terraform Apply using Service Principal"
                  export ARM_CLIENT_ID=$(servicePrincipalId)
                  export ARM_CLIENT_SECRET=$(servicePrincipalKey)
                  export ARM_TENANT_ID=$(tenantId)
                  export ARM_SUBSCRIPTION_ID=$(subscriptionId)

                  agentIP=$(curl -s https://checkip.amazonaws.com)

                  terraform init \
                    -backend-config="resource_group_name=$(tfStateRG)" \
                    -backend-config="storage_account_name=$(tfStateStorage)" \
                    -backend-config="container_name=$(tfStateContainer)" \
                    -backend-config="key=$(tfStateKey)"

                  echo "Moving tfplan to working directory"
                  mv terraformPlan/tfplan tfplan

                  terraform apply -auto-approve -var="agent_ip=$agentIP"
                displayName: 'Terraform Apply with SP Auth & Agent IP'

              - task: AzureCLI@2
                displayName: 'Remove DevOps Agent IP from Storage Account'
                condition: always()
                inputs:
                  azureSubscription: $(azureSubscription)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    agentIP=$(curl -s https://checkip.amazonaws.com)
                    echo "Removing IP: $agentIP from Storage Account"
                    az storage account network-rule remove \
                      --resource-group $(tfStateRG) \
                      --account-name $(tfStateStorage) \
                      --ip-address $agentIP
