#trigger:
#  branches:
#    include:
#      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  terraformVersion: '1.6.6'
  azureSubscription: 'sp-proj-cs'
  tfStateRG: 'tfstate'
  tfStateStorage: 'chaosstatestorage'
  tfStateContainer: 'tfstate'
  tfStateKey: 'chaosstudio.tfstate'

stages:
  - stage: Init
    displayName: 'Terraform Init'
    jobs:
      - job: InitJob
        displayName: 'Init Job'
        steps:
          - checkout: self
            persistCredentials: true

          - script: |
              echo "Installing Terraform $(terraformVersion)..."
              wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
              unzip terraform_$(terraformVersion)_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
              terraform --version
            displayName: 'Install Terraform'

          - task: AzureCLI@2
            inputs:
              azureSubscription: $(azureSubscription)
              addSpnToEnvironment: true
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Logging into Azure using SP and running terraform init..."
                  export ARM_CLIENT_ID=$servicePrincipalId
                  export ARM_CLIENT_SECRET=$servicePrincipalKey
                  export ARM_SUBSCRIPTION_ID=$subscriptionId
                  export ARM_TENANT_ID=$tenantId

                terraform init \
                  -backend-config="resource_group_name=$(tfStateRG)" \
                  -backend-config="storage_account_name=$(tfStateStorage)" \
                  -backend-config="container_name=$(tfStateContainer)" \
                  -backend-config="key=$(tfStateKey)"

  - stage: Plan
    displayName: 'Terraform Plan'
    dependsOn: Init
    jobs:
      - job: PlanJob
        displayName: 'Plan Job'
        steps:
          - checkout: self
            persistCredentials: true

          - script: |
              echo "Installing Terraform $(terraformVersion)..."
              wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
              unzip terraform_$(terraformVersion)_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
              terraform --version
            displayName: 'Install Terraform'

          - task: AzureCLI@2
            displayName: 'Add DevOps Agent IP to Key Vault'
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                agentIP=$(curl -s https://checkip.amazonaws.com)
                echo "Adding IP: $agentIP to Key Vault"
                az keyvault network-rule add \
                  --name kv-uks-lab12345 \
                  --resource-group chaos-lab-rg \
                  --ip-address $agentIP

          - task: AzureCLI@2
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Authenticating with Azure CLI"

                terraform init \
                  -backend-config="resource_group_name=$(tfStateRG)" \
                  -backend-config="storage_account_name=$(tfStateStorage)" \
                  -backend-config="container_name=$(tfStateContainer)" \
                  -backend-config="key=$(tfStateKey)"

                terraform plan -var="subscription_id=$(subscriptionId)" -var-file="env.tfvars" -out=tfplan

          - publish: tfplan
            artifact: terraformPlan

          - task: AzureCLI@2
            displayName: 'Remove DevOps Agent IP from Key Vault'
            condition: always()
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                agentIP=$(curl -s https://checkip.amazonaws.com)
                echo "Removing IP: $agentIP from Key Vault"
                az keyvault network-rule remove \
                  --name kv-uks-lab12345 \
                  --resource-group chaos-lab-rg \
                  --ip-address $agentIP

          - publish: tfplan
            artifact: terraformPlan

  - stage: Apply
    displayName: 'Terraform Apply'
    jobs:
    - deployment: ApplyJob
      displayName: 'Terraform Apply with Approval'
      environment: ChaosStudioEnv
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self
                persistCredentials: true

              - script: |
                  echo "Installing Terraform $(terraformVersion)..."
                  wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
                  unzip terraform_$(terraformVersion)_linux_amd64.zip
                  sudo mv terraform /usr/local/bin/
                  terraform --version
                displayName: 'Install Terraform'

              - task: AzureCLI@2
                displayName: 'Add DevOps Agent IP to Key Vault'
                inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      agentIP=$(curl -s https://checkip.amazonaws.com)
                      echo "Adding IP: $agentIP to Key Vault"
                      az keyvault network-rule add \
                        --name kv-uks-lab12345 \
                        --resource-group chaos-lab-rg \
                        --ip-address $agentIP

              - task: DownloadPipelineArtifact@2
                displayName: 'Download tfplan artifact'
                inputs:
                  artifact: terraformPlan
                  path: terraformPlan

              - task: AzureCLI@2
                inputs:
                  azureSubscription: $(azureSubscription)
                  scriptType: bash
                  scriptLocation: inlineScript
                  inlineScript: |
                    echo "Terraform Apply with Azure CLI context"

                    terraform init \
                      -backend-config="resource_group_name=$(tfStateRG)" \
                      -backend-config="storage_account_name=$(tfStateStorage)" \
                      -backend-config="container_name=$(tfStateContainer)" \
                      -backend-config="key=$(tfStateKey)"

                    echo "Moving tfplan to working directory"
                    mv terraformPlan/tfplan tfplan

                    terraform apply -auto-approve tfplan

              - task: AzureCLI@2
                displayName: 'Remove DevOps Agent IP from Key Vault'
                condition: always()
                inputs:
                    azureSubscription: $(azureSubscription)
                    scriptType: bash
                    scriptLocation: inlineScript
                    inlineScript: |
                      agentIP=$(curl -s https://checkip.amazonaws.com)
                      echo "Removing IP: $agentIP from Key Vault"
                      az keyvault network-rule remove \
                        --name kv-uks-lab12345 \
                        --resource-group chaos-lab-rg \
                        --ip-address $agentIP