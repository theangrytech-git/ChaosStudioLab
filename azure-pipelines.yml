trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  terraformVersion: '1.6.6'
  azureSubscription: 'sp-proj-cs'
  tfStateRG: 'tfstate'
  tfStateStorage: 'chaosstatestorage'
  tfStateContainer: 'tfstate'
  tfStateKey: 'chaosstudio.tfstate'

stages:
  - stage: Init
    displayName: 'Terraform Init'
    jobs:
      - job: InitJob
        displayName: 'Init Job'
        steps:
          - checkout: self

          - task: AzureCLI@2
            inputs:
              azureSubscription: $(azureSubscription)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Logging into Azure via Azure CLI"
                az account show

          - script: |
              echo "Installing Terraform $(terraformVersion)..."
              wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
              unzip terraform_$(terraformVersion)_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
              terraform --version
            displayName: 'Install Terraform'

          - script: |
              terraform init \
                -backend-config="resource_group_name=$(tfStateRG)" \
                -backend-config="storage_account_name=$(tfStateStorage)" \
                -backend-config="container_name=$(tfStateContainer)" \
                -backend-config="key=$(tfStateKey)"
            displayName: 'Terraform Init with Backend'

  - stage: Plan
    displayName: 'Terraform Plan'
    dependsOn: Init
    jobs:
      - job: PlanJob
        displayName: 'Plan Job'
        steps:
          - checkout: self
          - script: |
              echo "Installing Terraform $(terraformVersion)..."
              wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
              unzip terraform_$(terraformVersion)_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
              terraform --version
            displayName: 'Install Terraform'
            
          - script: |
              terraform init \
                -backend-config="resource_group_name=$(tfStateRG)" \
                -backend-config="storage_account_name=$(tfStateStorage)" \
                -backend-config="container_name=$(tfStateContainer)" \
                -backend-config="key=$(tfStateKey)"
            displayName: 'Terraform Init with Backend'

          - script: |
              terraform validate
            displayName: 'Terraform Validate'

          - script: |
              terraform plan -out=tfplan
            displayName: 'Terraform Plan'

          - publish: tfplan
            artifact: terraformPlan

  - stage: Apply
    displayName: 'Terraform Apply'
    dependsOn: Plan
    condition: succeeded()
    jobs:
      - job: ApplyJob
        displayName: 'Apply Job'
        steps:
          - checkout: self
          
          - script: |
              echo "Installing Terraform $(terraformVersion)..."
              wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
              unzip terraform_$(terraformVersion)_linux_amd64.zip
              sudo mv terraform /usr/local/bin/
              terraform --version
            displayName: 'Install Terraform'

          - script: |
              terraform init \
                -backend-config="resource_group_name=$(tfStateRG)" \
                -backend-config="storage_account_name=$(tfStateStorage)" \
                -backend-config="container_name=$(tfStateContainer)" \
                -backend-config="key=$(tfStateKey)"
            displayName: 'Terraform Init with Backend'

          - download: current
            artifact: terraformPlan

          - script: |
              terraform apply -auto-approve tfplan
            displayName: 'Terraform Apply'