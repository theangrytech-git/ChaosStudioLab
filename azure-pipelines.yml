pool:
  vmImage: 'ubuntu-latest'

variables:
  terraformVersion: '1.6.6'
  azureSubscription: 'sp-proj-cs'
  tfStateRG: 'tfstate'
  tfStateStorage: 'chaosstatestorage'
  tfStateContainer: 'tfstate'
  tfStateKey: 'chaosstudio.tfstate'

stages:
- stage: Init
  displayName: 'Terraform Init'
  jobs:
    - job: InitJob
      displayName: 'Init Job'
      steps:
        - checkout: self
          persistCredentials: true

        - script: |
            echo "Installing Terraform $(terraformVersion)..."
            wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
            unzip terraform_$(terraformVersion)_linux_amd64.zip
            sudo mv terraform /usr/local/bin/
            terraform --version
          displayName: 'Install Terraform'

        - task: AzureCLI@2
          displayName: 'Temporarily Open Storage & Add Agent IP to Key Vault'
          inputs:
            azureSubscription: $(azureSubscription)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              agentIP=$(curl -s https://checkip.amazonaws.com)
              echo "Detected Agent IP: $agentIP"

              echo "Temporarily setting Storage Account to Allow All"
              az storage account update \
                --name $(tfStateStorage) \
                --resource-group $(tfStateRG) \
                --default-action Allow

              echo "Adding agent IP to Key Vault"
              az keyvault network-rule add \
                --name kv-uks-lab12345 \
                --resource-group chaos-lab-rg \
                --ip-address $agentIP

        - script: |
            echo "Terraform Init using Service Principal"
            export ARM_CLIENT_ID=$(servicePrincipalId)
            export ARM_CLIENT_SECRET=$(servicePrincipalKey)
            export ARM_TENANT_ID=$(tenantId)
            export ARM_SUBSCRIPTION_ID=$(subscriptionId)

            terraform init \
              -backend-config="resource_group_name=$(tfStateRG)" \
              -backend-config="storage_account_name=$(tfStateStorage)" \
              -backend-config="container_name=$(tfStateContainer)" \
              -backend-config="key=$(tfStateKey)"
          displayName: 'Terraform Init with SP Auth'

        - task: AzureCLI@2
          displayName: 'Revert Storage & Remove Agent IP from Key Vault'
          condition: always()
          inputs:
            azureSubscription: $(azureSubscription)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              agentIP=$(curl -s https://checkip.amazonaws.com)
              echo "Removing agent IP: $agentIP from Key Vault"

              az keyvault network-rule remove \
                --name kv-uks-lab12345 \
                --resource-group chaos-lab-rg \
                --ip-address $agentIP

              echo "Setting Storage Account back to Selected Networks"
              az storage account update \
                --name $(tfStateStorage) \
                --resource-group $(tfStateRG) \
                --default-action Deny
                
- stage: Plan
  displayName: 'Terraform Plan'
  dependsOn: Init
  jobs:
    - job: PlanJob
      displayName: 'Plan Job'
      steps:
        - checkout: self
          persistCredentials: true

        - script: |
            echo "Installing Terraform $(terraformVersion)..."
            wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
            unzip terraform_$(terraformVersion)_linux_amd64.zip
            sudo mv terraform /usr/local/bin/
            terraform --version
          displayName: 'Install Terraform'

        - script: |
            agentIP=$(curl -s https://checkip.amazonaws.com)
            echo "Checking for Key Vault and Storage Account to allow IP: $agentIP"

            if az keyvault show --name kv-uks-lab12345 --resource-group chaos-lab-rg &> /dev/null; then
              echo "Adding IP to Key Vault..."
              az keyvault network-rule add --name kv-uks-lab12345 --resource-group chaos-lab-rg --ip-address $agentIP
            else
              echo "Key Vault not found. Skipping."
            fi

            if az storage account show --name $(tfStateStorage) --resource-group $(tfStateRG) &> /dev/null; then
              echo "Adding IP to Storage Account..."
              az storage account network-rule add --resource-group $(tfStateRG) --account-name $(tfStateStorage) --ip-address $agentIP
            else
              echo "Storage Account not found. Skipping."
            fi
          displayName: 'Conditionally Add DevOps Agent IP to Key Vault & Storage'
          env:
            AZURE_DEVOPS_EXT_AZURE_RM_SERVICE_PRINCIPAL_KEY: $(servicePrincipalKey)

        - script: |
            echo "Terraform Plan using Service Principal"
            export ARM_CLIENT_ID=$(servicePrincipalId)
            export ARM_CLIENT_SECRET=$(servicePrincipalKey)
            export ARM_TENANT_ID=$(tenantId)
            export ARM_SUBSCRIPTION_ID=$(subscriptionId)

            terraform init \
              -backend-config="resource_group_name=$(tfStateRG)" \
              -backend-config="storage_account_name=$(tfStateStorage)" \
              -backend-config="container_name=$(tfStateContainer)" \
              -backend-config="key=$(tfStateKey)"

            terraform plan -var="subscription_id=$(subscriptionId)" -var-file="env.tfvars" -out=tfplan
          displayName: 'Terraform Plan with SP Auth'

        - publish: tfplan
          artifact: terraformPlan

- stage: Apply
  displayName: 'Terraform Apply'
  dependsOn: Plan
  jobs:
    - deployment: ApplyJob
      displayName: 'Terraform Apply with Approval'
      environment: ChaosStudioEnv
      strategy:
        runOnce:
          deploy:
            steps:
              - checkout: self
                persistCredentials: true

              - script: |
                  echo "Installing Terraform $(terraformVersion)..."
                  wget https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
                  unzip terraform_$(terraformVersion)_linux_amd64.zip
                  sudo mv terraform /usr/local/bin/
                  terraform --version
                displayName: 'Install Terraform'

              - script: |
                  agentIP=$(curl -s https://checkip.amazonaws.com)
                  echo "Checking for Key Vault and Storage Account to allow IP: $agentIP"

                  if az keyvault show --name kv-uks-lab12345 --resource-group chaos-lab-rg &> /dev/null; then
                    echo "Adding IP to Key Vault..."
                    az keyvault network-rule add --name kv-uks-lab12345 --resource-group chaos-lab-rg --ip-address $agentIP
                  else
                    echo "Key Vault not found. Skipping."
                  fi

                  if az storage account show --name $(tfStateStorage) --resource-group $(tfStateRG) &> /dev/null; then
                    echo "Adding IP to Storage Account..."
                    az storage account network-rule add --resource-group $(tfStateRG) --account-name $(tfStateStorage) --ip-address $agentIP
                  else
                    echo "Storage Account not found. Skipping."
                  fi
                displayName: 'Conditionally Add DevOps Agent IP to Key Vault & Storage'

              - task: DownloadPipelineArtifact@2
                displayName: 'Download tfplan artifact'
                inputs:
                  artifact: terraformPlan
                  path: terraformPlan

              - script: |
                  echo "Terraform Apply using Service Principal"
                  export ARM_CLIENT_ID=$(servicePrincipalId)
                  export ARM_CLIENT_SECRET=$(servicePrincipalKey)
                  export ARM_TENANT_ID=$(tenantId)
                  export ARM_SUBSCRIPTION_ID=$(subscriptionId)

                  terraform init \
                    -backend-config="resource_group_name=$(tfStateRG)" \
                    -backend-config="storage_account_name=$(tfStateStorage)" \
                    -backend-config="container_name=$(tfStateContainer)" \
                    -backend-config="key=$(tfStateKey)"

                  echo "Moving tfplan to working directory"
                  mv terraformPlan/tfplan tfplan

                  terraform apply -auto-approve tfplan
                displayName: 'Terraform Apply with SP Auth'

              - script: |
                  agentIP=$(curl -s https://checkip.amazonaws.com)
                  echo "Removing IP: $agentIP from Key Vault and Storage Account"

                  if az keyvault show --name kv-uks-lab12345 --resource-group chaos-lab-rg &> /dev/null; then
                    az keyvault network-rule remove --name kv-uks-lab12345 --resource-group chaos-lab-rg --ip-address $agentIP
                  fi

                  if az storage account show --name $(tfStateStorage) --resource-group $(tfStateRG) &> /dev/null; then
                    az storage account network-rule remove --resource-group $(tfStateRG) --account-name $(tfStateStorage) --ip-address $agentIP
                  fi
                displayName: 'Remove DevOps Agent IP from Key Vault & Storage'
                condition: always()
