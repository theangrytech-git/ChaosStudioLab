name: MSDO
on:
  push:
    branches:
      - main

jobs:
  sample:
    name: Microsoft Security DevOps

    runs-on: windows-latest

    permissions:
      contents: read
      id-token: write
      actions: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Determine which tools should be enabled based on file presence
      - name: Set environment variables for tools
        run: |
          TOOLS="bandit,checkov,templateanalyzer,terrascan,trivy"

          # Check for JS/TS files before enabling ESLint
          if git ls-files | grep -E '\.(js|ts)$' > /dev/null; then
            TOOLS="$TOOLS,eslint"
          fi

          # Check for EXE/DLL files before enabling BinSkim
          if git ls-files | grep -E '\.(exe|dll)$' > /dev/null; then
            TOOLS="$TOOLS,binskim"
          fi

          echo "TOOLS=$TOOLS" >> $GITHUB_ENV

      # Run analyzers only with available tools
      - name: Run Microsoft Security DevOps
        uses: microsoft/security-devops-action@latest
        id: msdo
        with:
          tools: ${{ env.TOOLS }}

      # Upload alerts to the Security tab
      - name: Upload alerts to Security tab
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: ${{ steps.msdo.outputs.sarifFile }}
